# =============================================================================
# Service des fichiers statiques du front.
#
# Le point important est le repli : React Router gère les chemins côté client,
# et le serveur ne connaît que `index.html`. Sans `try_files`, ouvrir
# directement `/app/reservations` — ou simplement recharger la page — rendrait
# un 404 sur une route parfaitement valide.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : le paquet principal pèse 1,4 Mo, moins de 400 Ko compressé.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers produits par Vite portent une empreinte dans leur nom : leur
    # contenu ne change jamais à URL constante, ils peuvent donc être gardés
    # indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html`, lui, ne doit jamais être mis en cache : c'est lui qui
    # désigne la version des fichiers empreints. Un cache d'une heure ferait
    # charger l'ancien index après un déploiement, donc des fichiers disparus.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Repli du routage côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le proxy inverse traite `/api` et `/media` avant d'arriver ici ; la règle
    # ferme la porte au cas où la requête parviendrait quand même, plutôt que
    # de rendre `index.html` à un appel d'API — ce qui produirait une erreur de
    # syntaxe JSON incompréhensible côté client.
    location /api/ {
        return 404;
    }

    # Aucun en-tête de sécurité ici : ils sont posés par le proxy inverse, en
    # un seul endroit. Les dupliquer ferait diverger les deux configurations.
}

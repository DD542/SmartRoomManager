# =============================================================================
# SmartRoom Manager — services locaux
#
#   docker compose up -d db          démarre PostgreSQL seul
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python -m scripts.seed
#
# Le service `db` monte sql/00_extensions_enums.sql au premier démarrage : les
# extensions et les types sont ainsi disponibles avant toute migration.
# =============================================================================

name: smartroom

services:
  db:
    image: postgres:16-alpine
    container_name: smartroom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartroom}
      POSTGRES_USER: ${POSTGRES_USER:-smartroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartroom}
      # Encodage et collation figés : une base créée avec la collation de l'hôte
      # trierait « École » différemment d'une machine à l'autre.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TIMEZONE:-Europe/Paris}
      PGTZ: ${TIMEZONE:-Europe/Paris}
    command:
      # Les extensions sont créées par la migration ; ces réglages ne concernent
      # que le confort de développement et la lisibilité des journaux.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "timezone=Europe/Paris"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Exécuté une seule fois, à l'initialisation d'un volume vide.
      - ./sql/00_extensions_enums.sql:/docker-entrypoint-initdb.d/00_extensions_enums.sql:ro
    healthcheck:
      # `pg_isready` seul répond avant la fin de l'initialisation : la requête
      # garantit que la base accepte réellement du SQL.
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartroom-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-smartroom}
      POSTGRES_USER: ${POSTGRES_USER:-smartroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartroom}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
    name: smartroom_postgres_data

# =============================================================================
# Configuration de la campagne de tests.
#
# Trois marqueurs, trois régimes d'isolation :
#   (aucun)      domaine pur, sans base, exécutable partout
#   integration  transaction annulée en fin de test
#   concurrence  connexions réellement parallèles, nettoyage explicite
#
# Les tests de concurrence portent en plus un groupe xdist : les répartir sur
# plusieurs workers ferait s'affronter des tests conçus pour s'affronter entre
# eux, et le résultat ne prouverait plus rien.
# =============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --strict-markers
    --strict-config
    --tb=short

markers =
    integration: nécessite PostgreSQL ; transaction annulée en fin de test.
    concurrence: ouvre plusieurs connexions réelles ; nettoie ses écritures.
    lent: dépasse la seconde ; exclu par `-m "not lent"`.

# Aucun test asynchrone aujourd'hui. Le mode strict impose un marqueur explicite
# le jour où il y en aura, plutôt que de collecter silencieusement une coroutine
# jamais exécutée — un test qui ne s'exécute pas et qui passe est pire qu'absent.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning

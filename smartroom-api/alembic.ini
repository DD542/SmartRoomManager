# Configuration Alembic — SmartRoom Manager
# L'URL de connexion n'est pas écrite ici : env.py la lit depuis la
# configuration applicative, donc depuis l'environnement.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Horodatage en tête du nom de fichier : l'ordre des migrations reste lisible
# sans avoir à ouvrir chaque révision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
